worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Кэш иммутабельных ассетов Next.js
    map $uri $cache_control {
        ~^/_next/static/  "public, max-age=31536000, immutable";
        ~^/og/            "public, max-age=604800";
        default           "";
    }

    server {
        listen 80;
        server_name solarcalc.ru www.solarcalc.ru;

        # ACME для certbot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://solarcalc.ru$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name solarcalc.ru;

        ssl_certificate     /etc/letsencrypt/live/solarcalc.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/solarcalc.ru/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        client_max_body_size 2m;

        location /_next/static/ {
            proxy_pass http://127.0.0.1:3000;
            add_header Cache-Control $cache_control always;
            access_log off;
        }

        location /og/ {
            proxy_pass http://127.0.0.1:3000;
            add_header Cache-Control $cache_control always;
            access_log off;
        }

        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
            proxy_pass http://127.0.0.1:3000;
        }
    }
}
